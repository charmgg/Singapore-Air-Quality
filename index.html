<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singapore PM2.5</title>

<style>

/* =========================
   GENERAL
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #444;
}


/* =========================
   CONTAINER
   ========================= */

.container {
    width: 100%;
    margin: 0;
    padding: 7px 0;
}


/* =========================
   MAIN DASHBOARD
   ========================= */

.dashboard {
    display: grid;

    grid-template-columns: 360px 180px 180px;

    column-gap: 53px;

    align-items: start;

    width: fit-content;

    margin-left: auto;
    margin-right: auto;
}


/* =========================
   LEFT SECTION
   ========================= */

.left-section {
    width: 360px;
}


/* =========================
   TITLE
   ========================= */

.title {
    font-size: 26px;
    font-weight: 700;

    color: #111;

    margin: 0 0 6px 0;

    text-align: center;

    white-space: nowrap;
}


/* =========================
   SUBTITLE
   ========================= */

.subtitle {
    font-size: 14px;

    color: #111;

    margin: 0;

    text-align: center;

    white-space: nowrap;
}


/* =========================
   MAIN VALUE
   ========================= */

.main-value {
    width: 100%;

    text-align: center;

    margin-top: 28px;
}

.value {
    font-size: 50px;

    font-weight: bold;

    line-height: 1;
}

.unit {
    font-size: 14px;

    color: #777;

    margin-top: 8px;
}

.status {
    display: inline-block;

    padding: 7px 18px;

    border-radius: 20px;

    color: #ffffff;

    font-weight: bold;

    font-size: 16px;

    margin-top: 12px;
}


/* =========================
   REGION COLUMNS
   ========================= */

.region-column {
    width: 180px;

    display: flex;

    flex-direction: column;

    gap: 30px;
}


/* =========================
   REGION BOXES
   ========================= */

.region {
    width: 180px;

    height: 47px;

    padding: 0 12px;

    border-radius: 10px;

    background: #f5f5f5;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 16px;
}


/* =========================
   REGION NAME
   ========================= */

.region-name {
    font-weight: 600;

    white-space: nowrap;
}


/* =========================
   REGION VALUE
   ========================= */

.region-value {
    font-weight: bold;

    font-size: 18px;

    margin-left: 8px;
}


/* =========================
   CENTRAL AIS
   ========================= */

.region.central {
    width: 180px;

    height: 47px;

    background: #dbe442;

    color: #000000;
}


/* =========================
   UPDATED / SOURCE
   ========================= */

.info {
    width: 180px;

    margin-top: 0;
}

.updated {
    font-size: 12px;

    color: #888;

    margin-bottom: 12px;

    white-space: nowrap;
}

.source {
    font-size: 11px;

    color: #888;

    white-space: nowrap;
}

.source a {
    color: #888;

    text-decoration: underline;
}


/* =========================
   PM2.5 COLOURS
   ========================= */


/* Normal: 0–55 */

.green {
    color: #43a047;
}

.green-bg {
    background: #43a047;
}


/* Elevated: 56–150 */

.yellow {
    color: #fdd835;
}

.yellow-bg {
    background: #fdd835;
}


/* High: 151–250 */

.orange {
    color: #ef6c00;
}

.orange-bg {
    background: #ef6c00;
}


/* Very High: 251+ */

.red {
    color: #c62828;
}

.red-bg {
    background: #c62828;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 800px) {

    .container {
        padding: 10px 15px;
    }

    .dashboard {

        width: 100%;

        grid-template-columns: 1fr 1fr;

        column-gap: 15px;

        row-gap: 20px;
    }

    .left-section {

        width: 100%;

        grid-column: span 2;
    }

    .title,
    .subtitle {

        text-align: center;
    }

    .main-value {

        text-align: center;
    }

    .region-column {

        width: 100%;
    }

    .region {

        width: 100%;
    }

    .region.central {

        width: 100%;
    }

}


/* =========================
   VERY SMALL SCREEN
   ========================= */

@media (max-width: 500px) {

    .dashboard {

        grid-template-columns: 1fr;
    }

    .left-section {

        grid-column: span 1;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="dashboard">


<!-- =====================================================
     LEFT SECTION
     ===================================================== -->

<div class="left-section">


    <div class="title">

        Singapore Air Quality

    </div>


    <div class="subtitle">

        PM2.5 Reading - Updated Every 15 Minutes

    </div>


    <div class="main-value">


        <div
            id="mainValue"
            class="value yellow">

            --

        </div>


        <div class="unit">

            µg/m³

        </div>


        <div
            id="status"
            class="status yellow-bg">

            Loading...

        </div>


    </div>


</div>



<!-- =====================================================
     MIDDLE COLUMN
     ===================================================== -->

<div class="region-column">


    <!-- NORTH -->

    <div class="region">

        <span class="region-name">

            North

        </span>


        <span
            id="north"
            class="region-value">

            --

        </span>

    </div>



    <!-- EAST -->

    <div class="region">

        <span class="region-name">

            East

        </span>


        <span
            id="east"
            class="region-value">

            --

        </span>

    </div>



    <!-- WEST -->

    <div class="region">

        <span class="region-name">

            West

        </span>


        <span
            id="west"
            class="region-value">

            --

        </span>

    </div>


</div>



<!-- =====================================================
     RIGHT COLUMN
     ===================================================== -->

<div class="region-column">


    <!-- CENTRAL AIS -->

    <div class="region central">

        <span class="region-name">

            Central (AIS)

        </span>


        <span
            id="central"
            class="region-value">

            --

        </span>

    </div>



    <!-- SOUTH -->

    <div class="region">

        <span class="region-name">

            South

        </span>


        <span
            id="south"
            class="region-value">

            --

        </span>

    </div>



    <!-- UPDATED -->

    <div class="info">


        <div
            id="updated"
            class="updated">

            Loading latest data...

        </div>


        <div class="source">

            Source:

            <a
                href="https://www.haze.gov.sg/"
                target="_blank"
                rel="noopener noreferrer">

                haze.gov.sg

            </a>

        </div>


    </div>


</div>


</div>

</div>



<script>

/* =====================================================
   LOAD PM2.5 DATA
   ===================================================== */

async function loadPM25() {


    const API_URL =
        "https://api-open.data.gov.sg/v2/real-time/api/pm25";


    try {


        const response =
            await fetch(API_URL, {

                method: "GET",

                cache: "no-store"

            });


        /* =========================
           CHECK RESPONSE
           ========================= */

        if (!response.ok) {

            throw new Error(
                "HTTP Error: " +
                response.status
            );

        }


        /* =========================
           GET DATA
           ========================= */

        const result =
            await response.json();


        const item =
            result.data.items[0];


        const readings =
            item.readings.pm25_one_hourly;



        /* =========================
           DISPLAY REGIONAL VALUES
           ========================= */

        document
            .getElementById("north")
            .textContent =
            readings.north;


        document
            .getElementById("east")
            .textContent =
            readings.east;


        document
            .getElementById("west")
            .textContent =
            readings.west;


        document
            .getElementById("central")
            .textContent =
            readings.central;


        document
            .getElementById("south")
            .textContent =
            readings.south;



        /* =========================
           FIND HIGHEST READING
           ========================= */

        const values = [

            readings.north,
            readings.east,
            readings.west,
            readings.central,
            readings.south

        ].filter(

            value =>
                typeof value === "number"

        );


        if (values.length === 0) {

            throw new Error(
                "No PM2.5 readings available."
            );

        }


        const highest =
            Math.max(...values);



        /* =========================
           MAIN VALUE
           ========================= */

        const mainValue =
            document.getElementById(
                "mainValue"
            );


        mainValue.textContent =
            highest;


        mainValue.className =
            "value " +
            getColour(highest);



        /* =========================
           STATUS
           ========================= */

        const status =
            document.getElementById(
                "status"
            );


        status.textContent =
            getStatus(highest);


        status.className =
            "status " +
            getBackground(highest);



        /* =========================
           UPDATED TIME
           ========================= */

        const date =
            new Date(
                item.updatedTimestamp
            );


        document
            .getElementById("updated")
            .textContent =

            "Updated: " +

            date.toLocaleString(
                "en-SG",
                {

                    timeZone:
                        "Asia/Singapore",

                    day:
                        "numeric",

                    month:
                        "short",

                    year:
                        "numeric",

                    hour:
                        "numeric",

                    minute:
                        "2-digit",

                    hour12:
                        true

                }
            );


    }


    catch (error) {


        console.error(
            "Unable to load PM2.5:",
            error
        );


        document
            .getElementById("mainValue")
            .textContent =
            "--";


        document
            .getElementById("mainValue")
            .className =
            "value red";


        document
            .getElementById("status")
            .textContent =
            "Unable to load data";


        document
            .getElementById("status")
            .className =
            "status red-bg";


        document
            .getElementById("updated")
            .textContent =
            "Please try again later.";

    }

}


/* =====================================================
   STATUS RANGES
   =====================================================

   0–55       Normal
   56–150     Elevated
   151–250    High
   251+       Very High

   ===================================================== */

function getStatus(value) {


    if (value <= 55) {

        return "Normal";

    }


    if (value <= 150) {

        return "Elevated";

    }


    if (value <= 250) {

        return "High";

    }


    return "Very High";

}


/* =====================================================
   TEXT COLOUR
   ===================================================== */

function getColour(value) {


    if (value <= 55) {

        return "green";

    }


    if (value <= 150) {

        return "yellow";

    }


    if (value <= 250) {

        return "orange";

    }


    return "red";

}


/* =====================================================
   STATUS BACKGROUND COLOUR
   ===================================================== */

function getBackground(value) {


    if (value <= 55) {

        return "green-bg";

    }


    if (value <= 150) {

        return "yellow-bg";

    }


    if (value <= 250) {

        return "orange-bg";

    }


    return "red-bg";

}


/* =====================================================
   INITIAL LOAD
   ===================================================== */

loadPM25();


/* =====================================================
   REFRESH EVERY 15 MINUTES
   ===================================================== */

setInterval(

    loadPM25,

    15 * 60 * 1000

);

</script>


</body>

</html>
