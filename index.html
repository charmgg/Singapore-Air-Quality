<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singapore Air Quality</title>

<style>

/* =========================
   GENERAL
   ========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    font-family: Arial, Helvetica, sans-serif;
    background: transparent;
    color: #444;
}

.container {
    width: 100%;
    max-width: 950px;
    margin: 0 auto;
}


/* =========================
   MAIN AREA
   ========================= */

.title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #111;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #222;
    font-size: 14px;
    margin-bottom: 30px;
}


/* =========================
   MAIN PM2.5 VALUE
   ========================= */

.main-value {
    text-align: center;
    margin-bottom: 30px;
}

.value {
    font-size: 52px;
    font-weight: bold;
    line-height: 1;
}

.unit {
    font-size: 14px;
    color: #777;
    margin-top: 8px;
}

.status {
    display: inline-block;
    padding: 7px 20px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    font-size: 16px;
    margin-top: 12px;
}


/* =========================
   REGIONS
   ========================= */

.regions {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 32px;
    width: 100%;
    margin-top: 10px;
}

.region {
    min-width: 0;
    padding: 12px;
    border-radius: 10px;
    background: #f5f5f5;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 16px;
}

.region-name {
    font-weight: 600;
    white-space: nowrap;
}

.region-value {
    font-weight: bold;
    font-size: 18px;
    margin-left: 10px;
}


/* =========================
   CENTRAL AIS
   ========================= */

.region.central {
    background: #dbe442;
    color: #000000;
}


/* =========================
   UPDATED TIME
   ========================= */

.updated {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #888;
}


/* =========================
   ERROR
   ========================= */

.error {
    color: #c62828;
    text-align: center;
    font-weight: bold;
}


/* =========================
   PM2.5 COLOURS
   ========================= */

/* Normal: 0–55 */

.green {
    color: #43a047;
}

.green-bg {
    background: #43a047;
}


/* Elevated: 56–150 */

.yellow {
    color: #fdd835;
}

.yellow-bg {
    background: #fdd835;
    color: #000000;
}


/* High: 151–250 */

.orange {
    color: #ef6c00;
}

.orange-bg {
    background: #ef6c00;
}


/* Very High: 251+ */

.red {
    color: #c62828;
}

.red-bg {
    background: #c62828;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    .regions {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .region.central {
        grid-column: span 2;
    }

    .title {
        font-size: 24px;
    }

    .value {
        font-size: 48px;
    }
}

</style>

</head>


<body>

<div class="container">


    <!-- TITLE -->

    <div class="title">
        Singapore Air Quality
    </div>


    <!-- SUBTITLE -->

    <div class="subtitle">
        PM2.5 Reading - Updated Every 15 Minutes
    </div>


    <!-- MAIN VALUE -->

    <div class="main-value">

        <div id="mainValue" class="value yellow">
            --
        </div>

        <div class="unit">
            µg/m³
        </div>

        <div id="status" class="status yellow-bg">
            Loading...
        </div>

    </div>


    <!-- REGIONAL READINGS -->

    <div class="regions">


        <!-- NORTH -->

        <div class="region">

            <span class="region-name">
                North
            </span>

            <span id="north" class="region-value">
                --
            </span>

        </div>


        <!-- EAST -->

        <div class="region">

            <span class="region-name">
                East
            </span>

            <span id="east" class="region-value">
                --
            </span>

        </div>


        <!-- WEST -->

        <div class="region">

            <span class="region-name">
                West
            </span>

            <span id="west" class="region-value">
                --
            </span>

        </div>


        <!-- CENTRAL -->

        <div class="region central">

            <span class="region-name">
                Central (AIS)
            </span>

            <span id="central" class="region-value">
                --
            </span>

        </div>


        <!-- SOUTH -->

        <div class="region">

            <span class="region-name">
                South
            </span>

            <span id="south" class="region-value">
                --
            </span>

        </div>

    </div>


    <!-- UPDATED -->

    <div id="updated" class="updated">
        Loading latest data...
    </div>


</div>


<script>

/* =========================
   API
   ========================= */

async function loadPM25() {

    const API_URL =
        "https://api-open.data.gov.sg/v2/real-time/api/pm25";

    try {

        const response = await fetch(API_URL, {
            method: "GET",
            cache: "no-store"
        });


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " + response.status
            );

        }


        const result = await response.json();


        const item =
            result.data.items[0];


        const readings =
            item.readings.pm25_one_hourly;


        /* =========================
           REGIONAL VALUES
           ========================= */

        document.getElementById("north").textContent =
            readings.north;

        document.getElementById("east").textContent =
            readings.east;

        document.getElementById("west").textContent =
            readings.west;

        document.getElementById("central").textContent =
            readings.central;

        document.getElementById("south").textContent =
            readings.south;


        /* =========================
           FIND HIGHEST VALUE
           ========================= */

        const values = [

            readings.north,
            readings.east,
            readings.west,
            readings.central,
            readings.south

        ].filter(
            value => typeof value === "number"
        );


        if (values.length === 0) {

            throw new Error(
                "No PM2.5 readings available."
            );

        }


        const highest =
            Math.max(...values);


        /* =========================
           MAIN VALUE
           ========================= */

        const mainValue =
            document.getElementById("mainValue");


        mainValue.textContent =
            highest;


        mainValue.className =
            "value " + getColour(highest);


        /* =========================
           STATUS
           ========================= */

        const status =
            document.getElementById("status");


        status.textContent =
            getStatus(highest);


        status.className =
            "status " + getBackground(highest);


        /* =========================
           UPDATED TIME
           ========================= */

        const date =
            new Date(item.updatedTimestamp);


        document.getElementById("updated").textContent =
            "Updated: " +
            date.toLocaleString("en-SG", {

                timeZone: "Asia/Singapore",

                dateStyle: "medium",

                timeStyle: "short"

            });


    } catch (error) {

        console.error(
            "Unable to load PM2.5:",
            error
        );


        document.getElementById("mainValue")
            .textContent = "--";


        document.getElementById("mainValue")
            .className = "value red";


        document.getElementById("status")
            .textContent =
            "Unable to load data";


        document.getElementById("status")
            .className =
            "status red-bg";


        document.getElementById("updated")
            .textContent =
            "Please try again later.";

    }

}


/* =========================
   STATUS RANGES
   =========================

   0–55     = Normal
   56–150   = Elevated
   151–250  = High
   251+     = Very High

   ========================= */

function getStatus(value) {

    if (value <= 55) {
        return "Normal";
    }

    if (value <= 150) {
        return "Elevated";
    }

    if (value <= 250) {
        return "High";
    }

    return "Very High";
}


/* =========================
   TEXT COLOUR
   ========================= */

function getColour(value) {

    if (value <= 55) {
        return "green";
    }

    if (value <= 150) {
        return "yellow";
    }

    if (value <= 250) {
        return "orange";
    }

    return "red";
}


/* =========================
   STATUS BACKGROUND
   ========================= */

function getBackground(value) {

    if (value <= 55) {
        return "green-bg";
    }

    if (value <= 150) {
        return "yellow-bg";
    }

    if (value <= 250) {
        return "orange-bg";
    }

    return "red-bg";
}


/* =========================
   INITIAL LOAD
   ========================= */

loadPM25();


/* =========================
   REFRESH EVERY 15 MINUTES
   ========================= */

setInterval(
    loadPM25,
    15 * 60 * 1000
);

</script>

</body>
</html>
