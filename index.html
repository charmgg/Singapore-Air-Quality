<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singapore Air Quality</title>

<style>

/* =========================================
   RESET
   ========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #444;
}


/* =========================================
   MAIN CARD
   ========================================= */

.air-quality-card {

    width: 100%;

    min-height: 440px;

    background: #ffffff;

    border: 2px solid #555;

    border-radius: 18px;

    padding: 18px 34px 24px 34px;

    overflow: hidden;

}


/* =========================================
   MAIN DASHBOARD
   ========================================= */

.dashboard {

    width: 100%;

    height: 100%;

    display: grid;

    grid-template-columns:
        900px
        1fr;

    column-gap: 40px;

    align-items: center;

}


/* =========================================
   LEFT SIDE
   ========================================= */

.left-section {

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: column;

}


/* =========================================
   TITLE
   ========================================= */

.title {

    font-size: 48px;

    font-weight: 700;

    line-height: 1.1;

    color: #111;

    margin: 0;

}

.subtitle {

    font-size: 25px;

    color: #111;

    margin-top: 12px;

}


/* =========================================
   REGIONS
   ========================================= */

.regions {

    margin-top: 78px;

    width: 100%;

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    grid-template-rows:
        80px
        80px;

    column-gap: 55px;

    row-gap: 30px;

}


/* =========================================
   REGION BOX
   ========================================= */

.region {

    width: 100%;

    height: 80px;

    padding: 0 20px;

    border-radius: 14px;

    background: #f5f5f5;

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 25px;

}


/* =========================================
   REGION NAME
   ========================================= */

.region-name {

    font-weight: 600;

    white-space: nowrap;

}


/* =========================================
   REGION VALUE
   ========================================= */

.region-value {

    font-size: 27px;

    font-weight: 700;

    margin-left: 15px;

}


/* =========================================
   REGION POSITIONS
   ========================================= */

/*
    TOP:

    West | North | East

    BOTTOM:

    Central (AIS) | South | Information
*/


.west {

    grid-column: 1;
    grid-row: 1;

}


.north {

    grid-column: 2;
    grid-row: 1;

}


.east {

    grid-column: 3;
    grid-row: 1;

}


.central {

    grid-column: 1;
    grid-row: 2;

    background: #dbe842;

    color: #000000;

}


.south {

    grid-column: 2;
    grid-row: 2;

}


/* =========================================
   INFORMATION
   ========================================= */

.info {

    grid-column: 3;

    grid-row: 2;

    align-self: center;

    padding-left: 8px;

}


.updated {

    font-size: 17px;

    color: #888;

    margin-bottom: 18px;

    white-space: nowrap;

}


.source {

    font-size: 16px;

    color: #888;

    white-space: nowrap;

}


.source a {

    color: #777;

    text-decoration: underline;

}


/* =========================================
   RIGHT SIDE
   ========================================= */

.right-section {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 65px;

}


/* =========================================
   BIG VALUE
   ========================================= */

.value-container {

    text-align: center;

    min-width: 260px;

}


.value {

    font-size: 150px;

    font-weight: 700;

    line-height: 0.9;

}


.unit {

    font-size: 27px;

    color: #777;

    margin-top: 28px;

}


/* =========================================
   STATUS
   ========================================= */

.status {

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 310px;

    height: 100px;

    padding: 0 45px;

    border-radius: 55px;

    color: #ffffff;

    font-size: 38px;

    font-weight: 700;

    white-space: nowrap;

}


/* =========================================
   PM2.5 COLOURS
   ========================================= */


/* NORMAL 0-55 */

.green {

    color: #43a047;

}

.green-bg {

    background: #43a047;

}


/* ELEVATED 56-150 */

.yellow {

    color: #fdd835;

}

.yellow-bg {

    background: #fdd835;

}


/* HIGH 151-250 */

.orange {

    color: #ef6c00;

}

.orange-bg {

    background: #ef6c00;

}


/* VERY HIGH 251+ */

.red {

    color: #c62828;

}

.red-bg {

    background: #c62828;

}


/* =========================================
   TABLET
   ========================================= */

@media (max-width: 1300px) {

    .air-quality-card {

        min-height: 350px;

        padding: 20px;

    }


    .dashboard {

        grid-template-columns:
            62%
            38%;

        column-gap: 20px;

    }


    .title {

        font-size: 34px;

    }


    .subtitle {

        font-size: 17px;

    }


    .regions {

        margin-top: 55px;

        column-gap: 20px;

        row-gap: 20px;

        grid-template-rows:
            62px
            62px;

    }


    .region {

        height: 62px;

        font-size: 17px;

        padding: 0 15px;

    }


    .region-value {

        font-size: 19px;

    }


    .updated {

        font-size: 12px;

    }


    .source {

        font-size: 11px;

    }


    .right-section {

        gap: 25px;

    }


    .value-container {

        min-width: 130px;

    }


    .value {

        font-size: 80px;

    }


    .unit {

        font-size: 16px;

        margin-top: 12px;

    }


    .status {

        min-width: 150px;

        height: 55px;

        padding: 0 25px;

        font-size: 20px;

    }

}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 800px) {

    .air-quality-card {

        min-height: auto;

        border-radius: 12px;

        padding: 20px;

    }


    .dashboard {

        display: flex;

        flex-direction: column;

        gap: 30px;

    }


    .left-section {

        width: 100%;

    }


    .title {

        font-size: 30px;

        text-align: center;

    }


    .subtitle {

        font-size: 15px;

        text-align: center;

    }


    .regions {

        margin-top: 30px;

        grid-template-columns:
            1fr
            1fr;

        grid-template-rows: auto;

        gap: 10px;

    }


    .west,
    .north,
    .east,
    .central,
    .south,
    .info {

        grid-column: auto;

        grid-row: auto;

    }


    .region {

        height: 55px;

        font-size: 15px;

    }


    .region-value {

        font-size: 17px;

    }


    .info {

        padding-left: 5px;

        padding-top: 5px;

    }


    .right-section {

        width: 100%;

        gap: 20px;

    }


    .value {

        font-size: 70px;

    }


    .status {

        min-width: 140px;

        height: 55px;

        font-size: 20px;

    }

}

</style>

</head>


<body>


<div class="air-quality-card">


<div class="dashboard">


<!-- =====================================
     LEFT SECTION
     ===================================== -->

<div class="left-section">


    <!-- TITLE -->

    <div class="title">

        Singapore Air Quality

    </div>


    <!-- SUBTITLE -->

    <div class="subtitle">

        PM2.5 Reading - Updated Every 15 Minutes

    </div>



    <!-- =================================
         REGIONS
         ================================= -->

    <div class="regions">


        <!-- WEST -->

        <div class="region west">

            <span class="region-name">
                West
            </span>

            <span
                id="west"
                class="region-value">

                --

            </span>

        </div>



        <!-- NORTH -->

        <div class="region north">

            <span class="region-name">
                North
            </span>

            <span
                id="north"
                class="region-value">

                --

            </span>

        </div>



        <!-- EAST -->

        <div class="region east">

            <span class="region-name">
                East
            </span>

            <span
                id="east"
                class="region-value">

                --

            </span>

        </div>



        <!-- CENTRAL AIS -->

        <div class="region central">

            <span class="region-name">
                Central (AIS)
            </span>

            <span
                id="central"
                class="region-value">

                --

            </span>

        </div>



        <!-- SOUTH -->

        <div class="region south">

            <span class="region-name">
                South
            </span>

            <span
                id="south"
                class="region-value">

                --

            </span>

        </div>



        <!-- INFORMATION -->

        <div class="info">

            <div
                id="updated"
                class="updated">

                Loading latest data...

            </div>


            <div class="source">

                Source:

                <a
                    href="https://www.haze.gov.sg/"
                    target="_blank"
                    rel="noopener noreferrer">

                    haze.gov.sg

                </a>

            </div>

        </div>


    </div>


</div>



<!-- =====================================
     RIGHT SECTION
     ===================================== -->

<div class="right-section">


    <!-- BIG VALUE -->

    <div class="value-container">


        <div
            id="mainValue"
            class="value yellow">

            --

        </div>


        <div class="unit">

            µg/m³

        </div>


    </div>



    <!-- STATUS -->

    <div
        id="status"
        class="status yellow-bg">

        Loading...

    </div>


</div>


</div>

</div>



<script>

/* =========================================
   LOAD PM2.5 DATA
   ========================================= */

async function loadPM25() {


    const API_URL =
        "https://api-open.data.gov.sg/v2/real-time/api/pm25";


    try {


        const response =
            await fetch(
                API_URL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " +
                response.status
            );

        }


        const result =
            await response.json();


        const item =
            result.data.items[0];


        const readings =
            item.readings.pm25_one_hourly;



        /* =================================
           DISPLAY REGIONS
           ================================= */


        document
            .getElementById("west")
            .textContent =
            readings.west;


        document
            .getElementById("north")
            .textContent =
            readings.north;


        document
            .getElementById("east")
            .textContent =
            readings.east;


        document
            .getElementById("central")
            .textContent =
            readings.central;


        document
            .getElementById("south")
            .textContent =
            readings.south;



        /* =================================
           FIND HIGHEST VALUE
           ================================= */


        const values = [

            readings.west,
            readings.north,
            readings.east,
            readings.central,
            readings.south

        ].filter(

            value =>
                typeof value === "number"

        );


        if (values.length === 0) {

            throw new Error(
                "No PM2.5 readings available."
            );

        }


        const highest =
            Math.max(...values);



        /* =================================
           MAIN NUMBER
           ================================= */


        const mainValue =
            document.getElementById(
                "mainValue"
            );


        mainValue.textContent =
            highest;


        mainValue.className =
            "value " +
            getColour(highest);



        /* =================================
           STATUS
           ================================= */


        const status =
            document.getElementById(
                "status"
            );


        status.textContent =
            getStatus(highest);


        status.className =
            "status " +
            getBackground(highest);



        /* =================================
           UPDATED TIME
           ================================= */


        const date =
            new Date(
                item.updatedTimestamp
            );


        document
            .getElementById("updated")
            .textContent =

            "Updated: " +

            date.toLocaleString(
                "en-SG",
                {

                    timeZone:
                        "Asia/Singapore",

                    day:
                        "numeric",

                    month:
                        "short",

                    year:
                        "numeric",

                    hour:
                        "numeric",

                    minute:
                        "2-digit",

                    hour12:
                        true

                }
            );


    }

    catch (error) {


        console.error(
            "Unable to load PM2.5:",
            error
        );


        document
            .getElementById("mainValue")
            .textContent =
            "--";


        document
            .getElementById("mainValue")
            .className =
            "value red";


        document
            .getElementById("status")
            .textContent =
            "Unable to load data";


        document
            .getElementById("status")
            .className =
            "status red-bg";


        document
            .getElementById("updated")
            .textContent =
            "Please try again later.";

    }

}



/* =========================================
   STATUS
   ========================================= */

function getStatus(value) {


    if (value <= 55) {

        return "Normal";

    }


    if (value <= 150) {

        return "Elevated";

    }


    if (value <= 250) {

        return "High";

    }


    return "Very High";

}



/* =========================================
   NUMBER COLOUR
   ========================================= */

function getColour(value) {


    if (value <= 55) {

        return "green";

    }


    if (value <= 150) {

        return "yellow";

    }


    if (value <= 250) {

        return "orange";

    }


    return "red";

}



/* =========================================
   STATUS BACKGROUND
   ========================================= */

function getBackground(value) {


    if (value <= 55) {

        return "green-bg";

    }


    if (value <= 150) {

        return "yellow-bg";

    }


    if (value <= 250) {

        return "orange-bg";

    }


    return "red-bg";

}



/* =========================================
   INITIAL LOAD
   ========================================= */

loadPM25();



/* =========================================
   REFRESH EVERY 15 MINUTES
   ========================================= */

setInterval(

    loadPM25,

    15 * 60 * 1000

);

</script>


</body>

</html>
